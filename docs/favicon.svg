<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Mesma linguagem do site: fundo zinc-950, marca em branco.
       Monograma "EG" com o peso e o tracking apertado do display. -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#27272a"/>
  <text x="16" y="22.5"
        text-anchor="middle"
        fill="#fafafa"
        font-family="'Bricolage Grotesque','Inter',system-ui,-apple-system,'Segoe UI',sans-serif"
        font-weight="700"
        font-size="17"
        letter-spacing="-1.1">EG</text>
</svg>
