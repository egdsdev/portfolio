<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Elias Gomes - Desenvolvedor Full Stack</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#60a5fa">
  <meta name="description" content="Portfolio de Elias Gomes, Desenvolvedor Full Stack com experiência em PHP, Python, JavaScript, Angular, React e muito mais.">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Restaura tema salvo antes do Angular carregar (evita flash) -->
  <script>
    (function() {
      var saved = localStorage.getItem('portfolio-theme');
      var html = document.documentElement;
      html.classList.remove('dark', 'light');
      html.classList.add(saved === 'light' ? 'light' : 'dark');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
